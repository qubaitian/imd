[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imd"
version = "0.1.0"
description = "Interactive Markdown with IPython and Svelte"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "ipykernel>=6.29,<8",
  "jupyter-client>=8.6,<9",
  "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
]

[project.scripts]
imd = "imd.cli:main"

[tool.hatch.build]
artifacts = ["imd/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["imd"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
