[project]
name = "imd"
version = "0.1.0"
description = "A local Markdown editor with persistent xonsh sessions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "markdown-it-py>=3,<5",
  "pyte>=0.8,<1",
  "uvicorn[standard]>=0.34,<1",
  "xonsh>=0.19,<1",
]

[project.scripts]
imd = "imd.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx2>=2.13,<3", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:xonsh"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "imd/static"

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"
